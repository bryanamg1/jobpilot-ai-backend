name: Backend CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: backend-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  backend-docker-check:
    name: backend-docker-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t jobpilot-backend:${{ github.sha }} .

      - name: Start backend container
        run: |
          docker run -d \
            --name jobpilot-backend-ci \
            -p 4300:4300 \
            -e NODE_ENV=production \
            -e PORT=4300 \
            -e STORAGE_MODE=memory \
            -e AUTOMATION_KILL_SWITCH=true \
            -e OPENAI_FEATURE_MODE=disabled \
            -e DESKTOP_AGENT_ENABLED=false \
            jobpilot-backend:${{ github.sha }}

      - name: Wait for readiness
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://127.0.0.1:4300/api/v1/health > /dev/null; then
              echo "Backend health check passed"
              exit 0
            fi

            sleep 1
          done

          docker logs jobpilot-backend-ci
          exit 1

      - name: Smoke test health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:4300/api/v1/health > /dev/null

      - name: Show Docker logs on failure
        if: failure()
        run: docker logs jobpilot-backend-ci || true

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker rm -f jobpilot-backend-ci || true
          docker rmi jobpilot-backend:${{ github.sha }} || true
